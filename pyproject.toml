[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wheel-leg-lqr"
version = "0.1.0"
description = "Host-side wheel-leg modeling, LQR scheduling, and RDOB generation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "control>=0.10.2",
    "numpy>=1.24",
    "scipy>=1.10",
    "sympy>=1.12",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
wheelleg-schedule = "wheel_leg_lqr.gain_schedule:main"
wheelleg-controllability = "wheel_leg_lqr.symbolic_controllability:main"
wheelleg-bandwidth = "wheel_leg_lqr.analyze_bandwidth:main"
wheelleg-optimize-qr = "wheel_leg_lqr.optimize_qr:main"
wheelleg-rdob = "wheel_leg_lqr.rdob:main"
wheelleg-step-drop = "wheel_leg_lqr.analysis.step_drop:main"
wheelleg-airborne-lqr = "wheel_leg_lqr.airborne_lqr:main"
wheelleg-airborne-fl-pitch = "wheel_leg_lqr.airborne.fl_pitch:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wheel-legged-lqr"
version = "0.2.0"
description = "Fixed document-coordinate dynamics, discretization and discrete LQR"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "control>=0.10.2"]

[project.scripts]
wheel-legged-lqr = "wheel_legged_lqr.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

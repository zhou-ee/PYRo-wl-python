[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wheel-leg-lqr"
version = "0.2.0"
description = "Host-side wheel-leg modeling, LQR scheduling, and RDOB generation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "control>=0.10.2",
    "numpy>=1.24",
    "scipy>=1.10",
    "sympy>=1.12",
]

[project.optional-dependencies]
test = ["pytest>=8"]
cad = ["pandas>=2", "openpyxl>=3.1"]

[project.scripts]
wheelleg-fit-leg-com = "wheel_leg_lqr.cli.leg_com:main"
wheelleg-schedule = "wheel_leg_lqr.cli.ground_lqr:main"
wheelleg-controllability = "wheel_leg_lqr.cli.symbolic:main"
wheelleg-bandwidth = "wheel_leg_lqr.cli.bandwidth:main"
wheelleg-optimize-qr = "wheel_leg_lqr.cli.qr_optimizer:main"
wheelleg-rdob = "wheel_leg_lqr.cli.rdob:main"
wheelleg-step-drop = "wheel_leg_lqr.cli.step_drop:main"
wheelleg-airborne-lqr = "wheel_leg_lqr.cli.airborne_lqr:main"
wheelleg-airborne-fl-pitch = "wheel_leg_lqr.cli.airborne_fl_pitch:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
